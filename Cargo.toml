[package]
name = "notes-api"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Notes REST API on Postgres"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
jsonwebtoken = { version = "11", default-features = false, features = [
  "aws_lc_rs",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "postgres",
  "migrate",
  "macros",
  "uuid",
  "chrono",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "net",
  "time",
  "fs",
  "sync",
] }
tower-http = { version = "0.7", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
aws-lc-rs = "=1.19.0"
base64 = "=0.23.1"
http-body-util = "=0.1.5"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
